# ==============================================================================
# Reusable Stage Template: Terraform Plan
# Repository: AnqitG/Templates
# File: plan.yml
# ==============================================================================

parameters:
  - name: wd
    type: string
    default: '$(System.DefaultWorkingDirectory)'
    displayName: 'Terraform Working Directory'

  - name: env
    type: string
    default: 'dev'
    displayName: 'Target Environment'

  - name: sc
    type: string
    displayName: 'Azure Service Connection'

  - name: terraformVersion
    type: string
    default: 'latest'

  - name: backendRg
    type: string
    default: '$(rg)'

  - name: backendSa
    type: string
    default: '$(sa)'

  - name: backendContainer
    type: string
    default: '$(container)'

  - name: poolName
    type: string
    default: 'ubuntu-latest'

  - name: dependsOn
    type: object
    default: []
    displayName: 'Custom stage dependencies'

stages:
  - stage: TerraformPlan${{ parameters.env }}
    displayName: '📋 Terraform Plan ${{ parameters.env }}'
    ${{ if ne(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    ${{ else }}:
      dependsOn: TerraformValidate${{ parameters.env }}
    condition: succeeded()
    jobs:
      - job: TerraformPlan
        displayName: 'Terraform Plan ${{ parameters.env }}'
        pool:
          vmImage: ${{ parameters.poolName }}
        steps:
          - checkout: self

          - template: init.yml
            parameters:
              wd: ${{ parameters.wd }}
              sc: ${{ parameters.sc }}
              key: ${{ parameters.env }}
              terraformVersion: ${{ parameters.terraformVersion }}
              backendRg: ${{ parameters.backendRg }}
              backendSa: ${{ parameters.backendSa }}
              backendContainer: ${{ parameters.backendContainer }}

          - task: TerraformTask@5
            displayName: '📋 Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '${{ parameters.wd }}'
              environmentServiceNameAzureRM: '${{ parameters.sc }}'
