# ==============================================================================
# Reusable Step Template: Terraform Tool Installer & Backend Initialization
# Repository: ThatCurious1/Templates
# File: init.yml
# ==============================================================================

parameters:
  - name: wd
    type: string
    default: '$(System.DefaultWorkingDirectory)'
    displayName: 'Terraform Working Directory'

  - name: sc
    type: string
    displayName: 'Azure Service Connection'

  - name: key
    type: string
    default: 'default'
    displayName: 'Terraform State Key Prefix'

  - name: terraformVersion
    type: string
    default: 'latest'
    displayName: 'Terraform Version'

  - name: backendRg
    type: string
    default: '$(rg)'
    displayName: 'Backend Resource Group'

  - name: backendSa
    type: string
    default: '$(sa)'
    displayName: 'Backend Storage Account'

  - name: backendContainer
    type: string
    default: '$(container)'
    displayName: 'Backend Storage Container'

steps:
  - task: TerraformInstaller@1
    displayName: '⚙️ Install Terraform (${{ parameters.terraformVersion }})'
    inputs:
      terraformVersion: '${{ parameters.terraformVersion }}'

  - task: TerraformTask@5
    displayName: '🚀 Terraform Init (${{ parameters.key }}.tfstate)'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '${{ parameters.wd }}'
      backendServiceArm: '${{ parameters.sc }}'
      backendAzureRmResourceGroupName: '${{ parameters.backendRg }}'
      backendAzureRmStorageAccountName: '${{ parameters.backendSa }}'
      backendAzureRmContainerName: '${{ parameters.backendContainer }}'
      backendAzureRmKey: '${{ parameters.key }}.tfstate'
