# ==============================================================================
# Reusable Stage Template: Terraform Format & Validate
# Repository: ThatCurious1/Templates
# File: validate.yml
# ==============================================================================

parameters:
  - name: wd
    type: string
    default: '$(System.DefaultWorkingDirectory)'
    displayName: 'Terraform Working Directory'

  - name: env
    type: string
    default: 'dev'
    displayName: 'Target Environment'

  - name: sc
    type: string
    displayName: 'Azure Service Connection'

  - name: terraformVersion
    type: string
    default: 'latest'

  - name: backendRg
    type: string
    default: '$(rg)'

  - name: backendSa
    type: string
    default: '$(sa)'

  - name: backendContainer
    type: string
    default: '$(container)'

  - name: poolName
    type: string
    default: 'ubuntu-latest'

stages:
  - stage: TerraformValidate${{ parameters.env }}
    displayName: '🔍 Terraform Validate ${{ parameters.env }}'
    jobs:
      - job: TerraformValidate
        displayName: 'Terraform Validate ${{ parameters.env }}'
        pool:
          vmImage: ${{ parameters.poolName }}
        steps:
          - checkout: self

          - template: init.yml
            parameters:
              wd: ${{ parameters.wd }}
              sc: ${{ parameters.sc }}
              key: ${{ parameters.env }}
              terraformVersion: ${{ parameters.terraformVersion }}
              backendRg: ${{ parameters.backendRg }}
              backendSa: ${{ parameters.backendSa }}
              backendContainer: ${{ parameters.backendContainer }}

          - task: TerraformTask@5
            displayName: '✅ Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '${{ parameters.wd }}'
