parameters:
- name: sc
  type: string
- name: env
  type: string
- name: wd
  type: string

stages:
- stage: TerraformApply${{parameters.env}}
  displayName: Terraform Apply${{ parameters.env }}
  jobs:
  - job: TerraformApply
    displayName: Terraform Apply ${{ parameters.env}}
    steps:
    - template: init.yml
      parameters:
       wd: ${{ parameters.wd}}
       key: ${{ parameters.env }}
       sc: ${{ parameters.sc}}
    - task: TerraformTask@5
      displayName: Terraform Apply
      inputs:
        provider: 'azurerm'
        workingDirectory: '${{parameters.wd}}'
        command: 'apply'
        environmentServiceNameAzureRM: '${{ parameters.sc }}'
